services:
  localstack:
    image: localstack/localstack:3.7.2
    container_name: logwarehouse-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,kinesis,firehose,glue,cloudwatch,logs,sns,iam,sts
      - DEBUG=0
      - PERSISTENCE=0
      - DISABLE_CORS_CHECKS=1
      - SKIP_INFRA_DOWNLOADS=1
      - LAMBDA_EXECUTOR=local
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Remove the artificial per-call latency LocalStack injects into Kinesis.
      - KINESIS_LATENCY=0
      - KINESIS_SHARD_LIMIT=1000000
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # LocalStack community does not implement the Glue + Firehose control planes
  # (pro features) and its kinesis-mock backend is unusably slow at volume, so
  # the same genuine boto3/terraform API calls for kinesis, glue and firehose
  # are served by this moto sidecar. Everything else stays on LocalStack.
  # See docs/runbook.md for the rationale.
  moto:
    image: motoserver/moto:5.0.28
    container_name: logwarehouse-moto
    ports:
      - "4567:5000"
    environment:
      - MOTO_PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  localstack-data:
    name: logwarehouse-localstack-data
