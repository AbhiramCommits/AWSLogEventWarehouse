[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-log-event-warehouse"
version = "0.1.0"
description = "AWS-native streaming log-event data platform that runs end-to-end on LocalStack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AWSLogEventWarehouse" }]
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pyspark==3.5.1",
    "streamlit>=1.33",
    "plotly>=5.20",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[server]>=5.0",
    "ruff>=0.4",
    "awscli>=1.33",
]

[project.scripts]
logwarehouse = "logwarehouse.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["artifacts", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require a running LocalStack endpoint",
]
