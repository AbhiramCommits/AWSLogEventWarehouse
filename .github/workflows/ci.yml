name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

jobs:
  unit:
    name: Lint, unit tests & terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Unit tests (coverage)
        run: |
          pytest -m "not integration" \
            --cov=logwarehouse --cov=producers --cov=glue --cov=warehouse \
            --cov=monitoring --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml

      - name: Terraform fmt
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  e2e:
    name: LocalStack end-to-end
    runs-on: ubuntu-latest
    needs: unit
    services:
      localstack:
        image: localstack/localstack:3.7.2
        ports: ["4566:4566"]
        env:
          SERVICES: s3,kinesis,firehose,glue,cloudwatch,logs,sns,iam,sts
          PERSISTENCE: "0"
          KINESIS_LATENCY: "0"
      moto:
        image: motoserver/moto:5.0.28
        ports: ["4567:5000"]
        env:
          MOTO_PORT: "5000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Terraform init + apply
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - working-directory: infra/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Bootstrap local AWS resources
        run: python scripts/bootstrap_local_aws.py

      - name: Small end-to-end pipeline
        run: python scripts/run_pipeline.py --small

      - name: Data-quality gate
        run: python -m monitoring.alarms --check

      - name: Integration tests
        run: pytest -m integration -q
